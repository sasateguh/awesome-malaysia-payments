# Senarai gateway pembayaran Malaysia (PELAN-senarai-niche S8, D33). Teks EN/BM di sini = teks awam: DRAF sehingga flag S9
# dijawab `ok`. Kurasi: entri = SDK, plugin, pustaka, alat dan rujukan untuk gateway/kaedah pembayaran MALAYSIA (rasmi atau
# komuniti); kategori = gateway (pembangun mencari ikut gateway yang mereka pakai). Repo lapuk/kecil tetap entri — ambang
# membuangnya dan ia kembali sendiri. `kecuali` = bukan pembayaran ("chip"/"collect" perkakasan, CHIP Medicaid AS), contoh
# tutorial/hackathon/tugasan, aplikasi pengguna yang sekadar MEMAKAI gateway, fon ikon logo pihak ketiga, penerangan bukan Latin.
# bayarkit = baris produk (syarat repo_awam, disemak setiap larian) — TIDAK pernah entri berpangkat (§2.2).
id = "bayaran"
repo = "sasateguh/awesome-malaysia-payments"
bundar_bintang = 1
buang_fork = true
