[en]
tajuk = "Awesome Malaysia Payments"
pembuka = "Open-source SDKs, plugins and references for Malaysian payment gateways and methods, such as Billplz, toyyibPay, Bayarcash, CHIP, senangPay, iPay88, Fiuu, DuitNow and FPX. Ranked by stars and recent activity, refreshed every week."

[ms]
tajuk = "Senarai Berpangkat Pembayaran Malaysia"
pembuka = "SDK, plugin dan rujukan sumber terbuka untuk gateway dan kaedah pembayaran Malaysia, seperti Billplz, toyyibPay, Bayarcash, CHIP, senangPay, iPay88, Fiuu, DuitNow dan FPX. Dipangkat ikut bintang dan aktiviti terkini, dikemas setiap minggu."

[github]
# Deskripsi + topik repo (D38): deskripsi lulus config/gaya.toml; topik = `gilap topik --wajib awesome,awesome-list` 25 Okt
# (data GitHub; taksa dibuang). Teks awam — terbit bait-sama selepas kelulusan pemilik.
penerangan = "Ranked, weekly-updated list of open-source SDKs and plugins for Malaysian payment gateways such as Billplz, toyyibPay, CHIP and iPay88."
topik = ["awesome", "awesome-list", "laravel", "payments", "payment-gateway", "woocommerce", "payment", "malaysia", "fpx", "duitnow"]

[pangkat]
bintang = 1.0
aktif = 1.0

# Ekosistem kecil: SDK gateway tempatan jarang melebihi 10★ dan API gateway berubah perlahan (D33).
[ambang]
bintang_min = 3
hari_tidak_aktif = 1095

[produk]
nama = "bayarkit"
url = "https://github.com/sasateguh/bayarkit"
syarat = "repo_awam"
repo = "sasateguh/bayarkit"
# Blok "Daripada penyelenggara" di atas senarai (pemilik 25 Okt: iklan produk kita + hubungi; dilabel, tidak dipangkat).
# {bilangan} dikira setiap larian daripada registry repo itu (adapter yang wujud) — tidak ditaip, tidak basi.
en = "[{nama}]({url}) connects {bilangan} payment gateways used in Malaysia behind one interface, in TypeScript and PHP/Laravel. Sasa Teguh builds and integrates payment flows for businesses."
ms = "[{nama}]({url}) menyambungkan {bilangan} gateway pembayaran yang digunakan di Malaysia di belakang satu antara muka, dalam TypeScript dan PHP/Laravel. Sasa Teguh membina dan memasang aliran pembayaran untuk perniagaan."
bilangan = { fail = "gateways/registry.json", senarai = "gateways", ada = "adapter" }

[cari]
had = 100
pertanyaan = [
  "toyyibpay", "billplz", "bayarcash", "senangpay", "ipay88", "molpay", "fiuu", "razer merchant services",
  "eghl", "gkash", "curlec", '"chip-in" payment', "chip collect", "duitnow", "fpx malaysia", "fpx payment",
  "revenue monster", "managepay", "paydibs", "kiplepay", "malaysia payment gateway", "touch n go ewallet", "boost ewallet",
]

